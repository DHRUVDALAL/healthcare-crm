services:
  - type: web
    name: healthcare-recruitment-crm
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: "recruitment_crm_super_secure_production_jwt_secret_2026"
      - key: USE_EMBEDDED_DB
        value: "true"
